[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "efemat"
version = "1.0.0"
description = "EFE Materials Environment Toolkit — simulate, evaluate, synthesize, prototype, detail, and research sustainable EFE-compliant materials (aequchain program)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "aequchain dev" }]
keywords = ["materials", "lca", "sustainability", "efe", "aequchain", "circular-economy"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
efemat = "efemat.cli:main"

[tool.setuptools.packages.find]
include = ["efemat*"]

[tool.setuptools.package-data]
efemat = ["data/*.json"]
